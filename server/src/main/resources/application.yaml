spring:
  application:
    name: recurve
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:54330/recurve-database}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  elasticsearch:
    uris: ${ES_URL:http://localhost:9230}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

recurve:
  search:
    # Prepended to every index name. Empty in development; the integration
    # tests set "test-" so they never touch a development index.
    index-prefix: ""
  bootstrap:
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
