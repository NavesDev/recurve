spring:
  application:
    name: recurve
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:54330/recurve-database}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  elasticsearch:
    uris: ${ES_URL:http://localhost:9230}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

recurve:
  listing:
    # FR-07: the largest page any listing serves. Same for every endpoint.
    max-page-size: 100
  search:
    # Prepended to every index name. Empty in development; the integration
    # tests set "test-" so they never touch a development index.
    index-prefix: ""
  docs:
    # Serves the API contract and the Swagger UI at /docs, to anyone. The
    # contract is only a shape; a call through the UI still needs Basic
    # Auth. Turn off in production.
    enabled: ${DOCS_ENABLED:true}
  payment:
    # FR-04.7: "fake" (the default) charges nobody and needs no account;
    # "asaas" talks to Asaas, and then the three settings below are required
    # or the application does not start. The URL defaults to the sandbox.
    gateway: ${PAYMENT_GATEWAY:fake}
    asaas:
      api-url: ${ASAAS_API_URL:https://api-sandbox.asaas.com/v3}
      api-key: ${ASAAS_API_KEY:}
      webhook-token: ${ASAAS_WEBHOOK_TOKEN:}
  auth:
    token:
      # FR-05.3: signs operator tokens (HS256). At least 32 bytes, or the
      # application does not start. No default: a known key is no key.
      secret: ${JWT_SECRET:}
      ttl: ${JWT_TTL:8h}
  cors:
    # NFR-10: browser origins allowed to call the API, comma-separated.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  bootstrap:
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
