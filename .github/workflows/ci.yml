# Pull-request checks. The server's four jobs are one Maven step each and
# the web's three one npm script each, so a failure names the stage that
# broke. Mark all seven as required checks on main. The web's end-to-end
# journeys need the whole stack running and stay local (web/README.md).
name: CI

on:
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: server

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B pmd:check

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B test

  test-integration:
    name: test-integration
    runs-on: ubuntu-latest
    # Same images as docker-compose.yaml; the tests expect an empty
    # "recurve-test" database and an Elasticsearch node with security off.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: recurve-test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.7
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/recurve-test
      TEST_ES_URL: http://localhost:9200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The integration profile skips surefire; -Dpmd.skip keeps lint in
      # its own job.
      - run: ./mvnw -B verify -Pintegration -Dpmd.skip

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: recurve-server
          path: server/target/*.jar
          if-no-files-found: error

  web-lint:
    name: web-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # ESLint (architecture rules included) and the type check.
      - run: npm run lint

  web-test:
    name: web-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test

  web-build:
    name: web-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: recurve-web
          path: web/dist
          if-no-files-found: error
