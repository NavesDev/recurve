openapi: 3.0.3

# Written by hand; nothing is generated from or into the code. The tests
# under src/test and src/testIntegration keep the two aligned.

info:
  title: Recurve API
  version: 0.0.1
  description: |
    Recurring billing and subscription management engine.
    HTTP Basic on every request; one permission per route, `MANAGE_*` implies `VIEW_*`.

servers:
  - url: /

tags:
  - name: Users

security:
  - basicAuth: []

paths:

  /api/users:

    post:
      tags: [Users]
      operationId: createUser
      summary: Register an operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                user:
                  $ref: '#/components/examples/user'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    get:
      tags: [Users]
      operationId: searchUsers
      summary: List operators
      parameters:
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
              example:
                items:
                  - id: 9d1b2b2e-6c8e-4c53-9d5a-1f2a3b4c5d6e
                    name: Ada Lovelace
                    email: ada@recurve.local
                    permissions: [MANAGE_USERS]
                    active: true
                    createdAt: '2026-01-15T10:00:00Z'
                page: 0
                size: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/users/{id}:

    parameters:
      - $ref: '#/components/parameters/userId'

    get:
      tags: [Users]
      operationId: findUser
      summary: Get an operator
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                user:
                  $ref: '#/components/examples/user'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    put:
      tags: [Users]
      operationId: updateUser
      summary: Update an operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                user:
                  $ref: '#/components/examples/user'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      tags: [Users]
      operationId: deactivateUser
      summary: Deactivate an operator
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                id: 9d1b2b2e-6c8e-4c53-9d5a-1f2a3b4c5d6e
                name: Ada Lovelace
                email: ada@recurve.local
                permissions: [MANAGE_USERS]
                active: false
                createdAt: '2026-01-15T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/users/reindex:

    post:
      tags: [Users]
      operationId: reindexUsers
      summary: Rebuild the operator search index
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReindexResponse'
              example:
                indexed: 42
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  parameters:

    userId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    q:
      name: q
      in: query
      schema:
        type: string

    filter:
      name: filter
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: '^[^:]+:.+$'

    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

    size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    sort:
      name: sort
      in: query
      schema:
        type: string
        pattern: '^[^,:]+(:(asc|desc))?(,[^,:]+(:(asc|desc))?)*$'

  responses:

    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    BadGateway:
      description: Bad Gateway
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    ServiceUnavailable:
      description: Service Unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:

    Permission:
      type: string
      enum:
        - MANAGE_USERS
        - VIEW_PLANS
        - MANAGE_PLANS
        - VIEW_SUBSCRIBERS
        - MANAGE_SUBSCRIBERS
        - VIEW_PAYMENTS
        - MANAGE_PAYMENTS
        - MANAGE_SYSTEM

    CreateUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          pattern: '^[^@\s]+@[^@\s]+$'
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'

    UpdateUserRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          pattern: '^[^@\s]+@[^@\s]+$'
          maxLength: 255
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'

    UserResponse:
      type: object
      required: [id, name, email, permissions, active, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UserPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0

    ReindexResponse:
      type: object
      required: [indexed]
      properties:
        indexed:
          type: integer
          format: int64
          minimum: 0

    ApiError:
      type: object
      required: [status, error, message, timestamp, fieldErrors]
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

  examples:

    user:
      value:
        id: 9d1b2b2e-6c8e-4c53-9d5a-1f2a3b4c5d6e
        name: Ada Lovelace
        email: ada@recurve.local
        permissions: [MANAGE_USERS]
        active: true
        createdAt: '2026-01-15T10:00:00Z'
