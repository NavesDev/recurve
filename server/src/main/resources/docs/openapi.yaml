openapi: 3.0.3

# Written by hand; nothing is generated from or into the code. The tests
# under src/test and src/testIntegration keep the two aligned.

info:
  title: Recurve API
  version: 0.0.1
  description: |
    Recurring billing and subscription management engine.
    HTTP Basic on every request; one permission per route, `MANAGE_*` implies `VIEW_*`.

servers:
  - url: /

tags:
  - name: Users
  - name: Plans
  - name: Prices
  - name: Subscribers
  - name: Payments
  - name: Webhooks

security:
  - basicAuth: []

paths:

  /api/users:

    post:
      tags: [Users]
      operationId: createUser
      summary: Register an operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                user:
                  $ref: '#/components/examples/user'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    get:
      tags: [Users]
      operationId: searchUsers
      summary: List operators
      parameters:
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
              example:
                items:
                  - id: 9d1b2b2e-6c8e-4c53-9d5a-1f2a3b4c5d6e
                    name: Ada Lovelace
                    email: ada@recurve.local
                    permissions: [MANAGE_USERS]
                    active: true
                    createdAt: '2026-01-15T10:00:00Z'
                page: 0
                size: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/users/{id}:

    parameters:
      - $ref: '#/components/parameters/userId'

    get:
      tags: [Users]
      operationId: findUser
      summary: Get an operator
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                user:
                  $ref: '#/components/examples/user'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    put:
      tags: [Users]
      operationId: updateUser
      summary: Update an operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                user:
                  $ref: '#/components/examples/user'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      tags: [Users]
      operationId: deactivateUser
      summary: Deactivate an operator
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                id: 9d1b2b2e-6c8e-4c53-9d5a-1f2a3b4c5d6e
                name: Ada Lovelace
                email: ada@recurve.local
                permissions: [MANAGE_USERS]
                active: false
                createdAt: '2026-01-15T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/users/reindex:

    post:
      tags: [Users]
      operationId: reindexUsers
      summary: Rebuild the operator search index
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReindexResponse'
              example:
                indexed: 42
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/plans:

    post:
      tags: [Plans]
      operationId: createPlan
      summary: Register a plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
              example:
                id: 3f2a1b0c-9d8e-4f7a-8b6c-5d4e3f2a1b0c
                name: Pro
                description: For teams
                active: true
                createdAt: '2026-01-15T10:00:00Z'
                prices: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    get:
      tags: [Plans]
      operationId: searchPlans
      summary: List plans
      parameters:
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanPage'
              example:
                items:
                  - id: 3f2a1b0c-9d8e-4f7a-8b6c-5d4e3f2a1b0c
                    name: Pro
                    description: For teams
                    active: true
                    createdAt: '2026-01-15T10:00:00Z'
                    prices:
                      - id: 7c6b5a49-3827-4615-9e0d-1c2b3a4f5e6d
                        price: 49.90
                        currency: BRL
                        interval: MONTHLY
                        active: true
                        createdAt: '2026-01-15T10:00:00Z'
                page: 0
                size: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/plans/{id}:

    parameters:
      - $ref: '#/components/parameters/planId'

    get:
      tags: [Plans]
      operationId: findPlan
      summary: Get a plan
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
              examples:
                plan:
                  $ref: '#/components/examples/plan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    put:
      tags: [Plans]
      operationId: updatePlan
      summary: Update a plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
              examples:
                plan:
                  $ref: '#/components/examples/plan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      tags: [Plans]
      operationId: deactivatePlan
      summary: Deactivate a plan
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
              example:
                id: 3f2a1b0c-9d8e-4f7a-8b6c-5d4e3f2a1b0c
                name: Pro
                description: For teams
                active: false
                createdAt: '2026-01-15T10:00:00Z'
                prices:
                  - id: 7c6b5a49-3827-4615-9e0d-1c2b3a4f5e6d
                    price: 49.90
                    currency: BRL
                    interval: MONTHLY
                    active: true
                    createdAt: '2026-01-15T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/plans/{id}/prices:

    parameters:
      - $ref: '#/components/parameters/planId'

    post:
      tags: [Plans]
      operationId: addPrice
      summary: Add a price to a plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPriceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
              examples:
                plan:
                  $ref: '#/components/examples/plan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/plans/reindex:

    post:
      tags: [Plans]
      operationId: reindexPlans
      summary: Rebuild the plan search index
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReindexResponse'
              example:
                indexed: 12
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/prices/{id}/replace:

    parameters:
      - $ref: '#/components/parameters/priceId'

    post:
      tags: [Prices]
      operationId: replacePrice
      summary: Replace a price with a new amount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePriceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
              example:
                id: 3f2a1b0c-9d8e-4f7a-8b6c-5d4e3f2a1b0c
                name: Pro
                description: For teams
                active: true
                createdAt: '2026-01-15T10:00:00Z'
                prices:
                  - id: 7c6b5a49-3827-4615-9e0d-1c2b3a4f5e6d
                    price: 49.90
                    currency: BRL
                    interval: MONTHLY
                    active: false
                    createdAt: '2026-01-15T10:00:00Z'
                  - id: 0e1d2c3b-4a59-4687-b7c6-d5e4f3a2b1c0
                    price: 59.90
                    currency: BRL
                    interval: MONTHLY
                    active: true
                    createdAt: '2026-03-01T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/prices/{id}:

    parameters:
      - $ref: '#/components/parameters/priceId'

    delete:
      tags: [Prices]
      operationId: deactivatePrice
      summary: Deactivate a price
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
              example:
                id: 3f2a1b0c-9d8e-4f7a-8b6c-5d4e3f2a1b0c
                name: Pro
                description: For teams
                active: true
                createdAt: '2026-01-15T10:00:00Z'
                prices:
                  - id: 7c6b5a49-3827-4615-9e0d-1c2b3a4f5e6d
                    price: 49.90
                    currency: BRL
                    interval: MONTHLY
                    active: false
                    createdAt: '2026-01-15T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/subscribers:

    post:
      tags: [Subscribers]
      operationId: createSubscriber
      summary: Register a subscriber on a price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriberRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriberResponse'
              examples:
                subscriber:
                  $ref: '#/components/examples/subscriber'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    get:
      tags: [Subscribers]
      operationId: searchSubscribers
      summary: List subscribers
      parameters:
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriberPage'
              example:
                items:
                  - id: 5e4d3c2b-1a09-4f8e-9d7c-6b5a4f3e2d1c
                    name: Grace Hopper
                    email: grace@navy.mil
                    document: '52998224725'
                    status: ACTIVE
                    planId: 3f2a1b0c-9d8e-4f7a-8b6c-5d4e3f2a1b0c
                    planPriceId: 7c6b5a49-3827-4615-9e0d-1c2b3a4f5e6d
                    price: 49.90
                    currency: BRL
                    interval: MONTHLY
                    startedAt: '2026-01-15T10:00:00Z'
                    nextBillingAt: '2026-02-15T10:00:00Z'
                    createdAt: '2026-01-15T10:00:00Z'
                page: 0
                size: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/subscribers/{id}:

    parameters:
      - $ref: '#/components/parameters/subscriberId'

    get:
      tags: [Subscribers]
      operationId: findSubscriber
      summary: Get a subscriber
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriberResponse'
              examples:
                subscriber:
                  $ref: '#/components/examples/subscriber'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    put:
      tags: [Subscribers]
      operationId: updateSubscriber
      summary: Update a subscriber's name and email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriberRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriberResponse'
              examples:
                subscriber:
                  $ref: '#/components/examples/subscriber'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      tags: [Subscribers]
      operationId: cancelSubscriber
      summary: Cancel a subscriber
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriberResponse'
              example:
                id: 5e4d3c2b-1a09-4f8e-9d7c-6b5a4f3e2d1c
                name: Grace Hopper
                email: grace@navy.mil
                document: '52998224725'
                status: CANCELED
                planId: 3f2a1b0c-9d8e-4f7a-8b6c-5d4e3f2a1b0c
                planPriceId: 7c6b5a49-3827-4615-9e0d-1c2b3a4f5e6d
                price: 49.90
                currency: BRL
                interval: MONTHLY
                startedAt: '2026-01-15T10:00:00Z'
                nextBillingAt: '2026-02-15T10:00:00Z'
                canceledAt: '2026-02-01T09:00:00Z'
                createdAt: '2026-01-15T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/subscribers/reindex:

    post:
      tags: [Subscribers]
      operationId: reindexSubscribers
      summary: Rebuild the subscriber search index
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReindexResponse'
              example:
                indexed: 240
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/payments:

    post:
      tags: [Payments]
      operationId: requestPayment
      summary: Charge a subscriber's current cycle
      description: Records the charge and sends it to the payment gateway. If the gateway fails, the charge stays recorded and unsent (502); `POST /api/payments/{id}/send` retries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPaymentRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                payment:
                  $ref: '#/components/examples/payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    get:
      tags: [Payments]
      operationId: searchPayments
      summary: List payments
      parameters:
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPage'
              example:
                items:
                  - id: 2b1a0f9e-8d7c-4b6a-9e5d-4c3b2a1f0e9d
                    subscriberId: 5e4d3c2b-1a09-4f8e-9d7c-6b5a4f3e2d1c
                    amount: 49.90
                    currency: BRL
                    status: PENDING
                    dueAt: '2026-02-15T10:00:00Z'
                    externalId: pay_080225913252
                    invoiceUrl: https://sandbox.asaas.com/i/080225913252
                    createdAt: '2026-02-10T09:00:00Z'
                page: 0
                size: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/payments/{id}:

    parameters:
      - $ref: '#/components/parameters/paymentId'

    get:
      tags: [Payments]
      operationId: findPayment
      summary: Get a payment
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                payment:
                  $ref: '#/components/examples/payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/payments/{id}/send:

    parameters:
      - $ref: '#/components/parameters/paymentId'

    post:
      tags: [Payments]
      operationId: sendPayment
      summary: Send a charge to the payment gateway
      description: Retries a send that failed. A charge already sent is returned as it is.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                payment:
                  $ref: '#/components/examples/payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/payments/{id}/confirm:

    parameters:
      - $ref: '#/components/parameters/paymentId'

    post:
      tags: [Payments]
      operationId: confirmPayment
      summary: Confirm a payment received outside the gateway
      description: The gateway is told first; if it refuses (502), nothing changes. The subscriber becomes active and its next billing date advances one cycle.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                payment:
                  $ref: '#/components/examples/payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/payments/{id}/refund:

    parameters:
      - $ref: '#/components/parameters/paymentId'

    post:
      tags: [Payments]
      operationId: refundPayment
      summary: Refund a paid payment
      description: The gateway gives it back first; if it refuses (502), nothing changes.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                payment:
                  $ref: '#/components/examples/payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/payments/reindex:

    post:
      tags: [Payments]
      operationId: reindexPayments
      summary: Rebuild the payment search index
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReindexResponse'
              example:
                indexed: 1200
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/webhooks/asaas:

    post:
      tags: [Webhooks]
      operationId: receiveAsaasEvent
      summary: Receive an event from Asaas
      description: Called by Asaas, not by an operator. Authenticated by the `asaas-access-token` header, not by HTTP Basic. Exists only when the gateway is Asaas. Events Recurve does not act on, or about charges it does not hold, are still answered 200.
      security: []
      parameters:
        - name: asaas-access-token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsaasEvent'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  parameters:

    userId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    planId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    priceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    paymentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    subscriberId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    q:
      name: q
      in: query
      schema:
        type: string

    filter:
      name: filter
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: '^[^:]+:.+$'

    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

    size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    sort:
      name: sort
      in: query
      schema:
        type: string
        pattern: '^[^,:]+(:(asc|desc))?(,[^,:]+(:(asc|desc))?)*$'

  responses:

    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    BadGateway:
      description: Bad Gateway
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    ServiceUnavailable:
      description: Service Unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:

    Permission:
      type: string
      enum:
        - MANAGE_USERS
        - VIEW_PLANS
        - MANAGE_PLANS
        - VIEW_SUBSCRIBERS
        - MANAGE_SUBSCRIBERS
        - VIEW_PAYMENTS
        - MANAGE_PAYMENTS
        - MANAGE_SYSTEM

    CreateUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          pattern: '^[^@\s]+@[^@\s]+$'
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'

    UpdateUserRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          pattern: '^[^@\s]+@[^@\s]+$'
          maxLength: 255
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'

    UserResponse:
      type: object
      required: [id, name, email, permissions, active, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UserPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0

    BillingInterval:
      type: string
      enum:
        - MONTHLY
        - YEARLY

    CreatePlanRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          nullable: true
          maxLength: 500

    UpdatePlanRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          nullable: true
          maxLength: 500

    AddPriceRequest:
      type: object
      required: [price, currency, interval]
      properties:
        price:
          type: number
          minimum: 0.01
          maximum: 9999999999.99
        currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
        interval:
          $ref: '#/components/schemas/BillingInterval'

    ReplacePriceRequest:
      type: object
      required: [price]
      properties:
        price:
          type: number
          minimum: 0.01
          maximum: 9999999999.99

    PriceResponse:
      type: object
      required: [id, price, currency, interval, active, createdAt]
      properties:
        id:
          type: string
          format: uuid
        price:
          type: number
          minimum: 0.01
          maximum: 9999999999.99
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        interval:
          $ref: '#/components/schemas/BillingInterval'
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    PlanResponse:
      type: object
      required: [id, name, active, createdAt, prices]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        prices:
          type: array
          items:
            $ref: '#/components/schemas/PriceResponse'

    PlanPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlanResponse'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0

    SubscriberStatus:
      type: string
      enum:
        - ACTIVE
        - PAST_DUE
        - CANCELED

    CreateSubscriberRequest:
      type: object
      required: [name, email, document, planPriceId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 255
        document:
          type: string
          description: CPF or CNPJ, with or without punctuation
          maxLength: 18
        planPriceId:
          type: string
          format: uuid

    UpdateSubscriberRequest:
      type: object
      required: [name, email, document]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 255
        document:
          type: string
          description: CPF or CNPJ, with or without punctuation
          maxLength: 18

    SubscriberResponse:
      type: object
      required: [id, name, email, status, planId, planPriceId, price, currency, interval, startedAt, nextBillingAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        document:
          type: string
          nullable: true
          description: CPF or CNPJ, digits only; absent for subscribers registered before it was required
          pattern: '^([0-9]{11}|[0-9]{14})$'
        status:
          $ref: '#/components/schemas/SubscriberStatus'
        planId:
          type: string
          format: uuid
        planPriceId:
          type: string
          format: uuid
        price:
          type: number
          minimum: 0.01
          maximum: 9999999999.99
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        interval:
          $ref: '#/components/schemas/BillingInterval'
        startedAt:
          type: string
          format: date-time
        nextBillingAt:
          type: string
          format: date-time
        canceledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    SubscriberPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriberResponse'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0

    PaymentStatus:
      type: string
      enum:
        - PENDING
        - PAID
        - FAILED
        - REFUNDED

    RequestPaymentRequest:
      type: object
      required: [subscriberId]
      properties:
        subscriberId:
          type: string
          format: uuid

    PaymentResponse:
      type: object
      required: [id, subscriberId, amount, currency, status, dueAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        subscriberId:
          type: string
          format: uuid
        amount:
          type: number
          minimum: 0.01
          maximum: 9999999999.99
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        dueAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
          nullable: true
        refundedAt:
          type: string
          format: date-time
          nullable: true
        externalId:
          type: string
          nullable: true
          description: the charge's id at the payment gateway; absent until it is sent
        invoiceUrl:
          type: string
          nullable: true
          description: where the customer pays the charge
        createdAt:
          type: string
          format: date-time

    PaymentPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentResponse'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0

    AsaasEvent:
      type: object
      description: Asaas's webhook body; only `event` and `payment.id`/`payment.externalReference` are read, everything else is ignored.
      required: [event]
      additionalProperties: true
      properties:
        event:
          type: string
          example: PAYMENT_RECEIVED
        payment:
          type: object
          additionalProperties: true
          properties:
            id:
              type: string
            externalReference:
              type: string
              nullable: true

    ReindexResponse:
      type: object
      required: [indexed]
      properties:
        indexed:
          type: integer
          format: int64
          minimum: 0

    ApiError:
      type: object
      required: [status, error, message, timestamp, fieldErrors]
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

  examples:

    user:
      value:
        id: 9d1b2b2e-6c8e-4c53-9d5a-1f2a3b4c5d6e
        name: Ada Lovelace
        email: ada@recurve.local
        permissions: [MANAGE_USERS]
        active: true
        createdAt: '2026-01-15T10:00:00Z'

    plan:
      value:
        id: 3f2a1b0c-9d8e-4f7a-8b6c-5d4e3f2a1b0c
        name: Pro
        description: For teams
        active: true
        createdAt: '2026-01-15T10:00:00Z'
        prices:
          - id: 7c6b5a49-3827-4615-9e0d-1c2b3a4f5e6d
            price: 49.90
            currency: BRL
            interval: MONTHLY
            active: true
            createdAt: '2026-01-15T10:00:00Z'

    subscriber:
      value:
        id: 5e4d3c2b-1a09-4f8e-9d7c-6b5a4f3e2d1c
        name: Grace Hopper
        email: grace@navy.mil
        document: '52998224725'
        status: ACTIVE
        planId: 3f2a1b0c-9d8e-4f7a-8b6c-5d4e3f2a1b0c
        planPriceId: 7c6b5a49-3827-4615-9e0d-1c2b3a4f5e6d
        price: 49.90
        currency: BRL
        interval: MONTHLY
        startedAt: '2026-01-15T10:00:00Z'
        nextBillingAt: '2026-02-15T10:00:00Z'
        createdAt: '2026-01-15T10:00:00Z'

    payment:
      value:
        id: 2b1a0f9e-8d7c-4b6a-9e5d-4c3b2a1f0e9d
        subscriberId: 5e4d3c2b-1a09-4f8e-9d7c-6b5a4f3e2d1c
        amount: 49.90
        currency: BRL
        status: PENDING
        dueAt: '2026-02-15T10:00:00Z'
        externalId: pay_080225913252
        invoiceUrl: https://sandbox.asaas.com/i/080225913252
        createdAt: '2026-02-10T09:00:00Z'
